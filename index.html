<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main>
      <section class="identity" id="identity">
        <div class="container">
          <div class="evolution">
            <h2 class="evolution__title">Evolution</h2>
            <p class="level-text">Level <span class="level">1</span></p>
            <div class="evolution__progress">
              <label class="evolution__progress-label" for="xp"
                ><span>n</span>%</label
              >
              <progress
                class="evolution-bar"
                id="xp"
                value="1"
                max="100"
              ></progress>
            </div>
            <div class="skills">
              <ul class="skills__list">
                <li class="skills__list-item">HTML</li>
                <li class="skills__list-item">CSS</li>
              </ul>
            </div>
          </div>
          <div class="goal__progress">
            <h2 class="goal__title">Current quest</h2>
            <p class="goal__name">Goal</p>
            <div class="goal__status">
              <label class="goal__label" for="current-goal-progress">
                <span class="goal__percent">10</span>%
              </label>

              <progress
                class="goal__bar"
                id="current-goal-progress"
                value="10"
                max="100"
              ></progress>
            </div>
            <ul class="goal__steps">
              <li class="goal__steps-item">Complete JS</li>
              <li class="goal__steps-item">Create my own project</li>
              <li class="goal__steps-item">Create a resume</li>
            </ul>
          </div>
        </div>
      </section>
      <section class="daily" id="daily">
        <div class="container">
          <div class="daily__header">
            <h2 class="daily__title">TODAY'S FOCUS</h2>
            <p class="daily__date">DATE</p>
          </div>

          <ul class="daily__list">
            <li class="daily__item">...</li>
            <li class="daily__item">...</li>
            <li class="daily__item">...</li>
            <li class="daily__item">...</li>
          </ul>
        </div>
      </section>
      <section class="vision" id="vision">
        <div class="container">
          <h2 class="vision__title">My vision</h2>

          <ul class="vision__list">
            <li class="vision__item">Frontend</li>
            <li class="vision__item">Backend</li>
            <li class="vision__item">Money</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
